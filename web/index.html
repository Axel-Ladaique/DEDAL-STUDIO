<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEDAL Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --bg: #080c10;
    --surface: #0d1520;
    --surface2: #111e2e;
    --border: #1a2d45;
    --border2: #243d58;
    --accent: #00d4ff;
    --accent3: #39ff14;
    --danger: #ff4d4d;
    --text: #c8dde8;
    --dim: #4a6070;
    --mono: 'Share Tech Mono', 'Courier New', monospace;
    --font-hud: 'Orbitron', monospace;
    --logo-accent: #00ff9d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
  }

  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 32px;
    display: flex; align-items: center; gap: 16px;
  }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo-icon {
    width: 36px; height: 36px;
    border: 2px solid var(--logo-accent);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    animation: pulse-border 3s ease-in-out infinite;
  }
  @keyframes pulse-border {
    0%,100% { box-shadow: 0 0 12px rgba(0,255,157,0.3); }
    50%      { box-shadow: 0 0 24px rgba(0,255,157,0.7); }
  }
  .logo h1 {
    font-family: var(--font-hud); font-size: 20px; font-weight: 700;
    letter-spacing: 4px; color: var(--logo-accent);
  }
  .logo span {
    font-family: var(--font-hud); font-size: 9px;
    letter-spacing: 2px; color: var(--dim); display: block;
  }

  .app-layout {
    display: flex; height: calc(100vh - 53px); overflow: hidden;
  }
  .list-panel {
    flex: 1; min-width: 0; overflow: hidden;
    padding: 24px 32px;
    display: flex; flex-direction: column;
  }
  #active-filters { flex-shrink: 0; }
  .map-panel {
    width: 420px; flex-shrink: 0;
    border-left: 1px solid var(--border);
    display: flex; flex-direction: column;
  }
  .map-controls {
    padding: 8px 12px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px; flex-shrink: 0;
    font-family: var(--mono); font-size: 10px;
  }
  .map-label { color: var(--dim); letter-spacing: 2px; text-transform: uppercase; margin-right: 4px; }
  .map-toggle {
    background: transparent; border: 1px solid var(--border2);
    color: var(--dim); font-family: var(--mono); font-size: 10px;
    letter-spacing: 1px; padding: 4px 10px; border-radius: 3px;
    cursor: pointer; text-transform: uppercase; transition: all .12s;
  }
  .map-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .map-toggle.active { border-color: var(--accent); color: var(--accent); background: rgba(0,212,255,0.08); }
  #map { flex: 1; }
  .resize-handle {
    width: 5px; flex-shrink: 0;
    background: var(--border); cursor: col-resize;
    transition: background .15s;
  }
  .resize-handle:hover, .resize-handle.dragging { background: var(--accent); }
  .map-no-gps {
    flex: 1; display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 11px; color: var(--dim);
    letter-spacing: 1px; text-align: center; padding: 24px;
  }

  .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .toolbar input[type="search"] {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); font-size: 13px; font-family: var(--mono);
    padding: 8px 12px; border-radius: 4px; width: 240px; outline: none;
  }
  .toolbar input[type="search"]:focus { border-color: var(--accent); }
  .toolbar input[type="search"]::placeholder { color: var(--dim); }

  .btn {
    background: transparent; border: 1px solid var(--accent);
    color: var(--accent); font-family: var(--mono); font-size: 11px;
    letter-spacing: 2px; padding: 8px 16px; border-radius: 4px;
    cursor: pointer; text-transform: uppercase; transition: background .12s;
    white-space: nowrap;
  }
  .btn:hover { background: rgba(0,212,255,0.1); }
  .btn.danger { border-color: var(--danger); color: var(--danger); }
  .btn.danger:hover { background: rgba(255,77,77,0.1); }
  .btn.sm { padding: 5px 10px; font-size: 10px; }

  .toolbar { flex-shrink: 0; }
  .sessions-wrap {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; overflow: hidden;
    flex: 1; min-height: 0;
    display: flex; flex-direction: column;
  }
  .sessions-header { flex-shrink: 0; }
  #session-list { overflow-y: auto; flex: 1; min-height: 0; }
  .bottom-row { flex-shrink: 0; }
  .sessions-header {
    display: grid;
    grid-template-columns: 170px 1fr 110px 110px 155px 110px 110px;
    padding: 10px 20px;
    background: var(--surface2); border-bottom: 1px solid var(--border);
    font-family: var(--mono); font-size: 10px; letter-spacing: 2px;
    text-transform: uppercase; color: var(--dim);
  }
  .sessions-header [data-sort] { cursor: pointer; user-select: none; }
  .sessions-header [data-sort]:hover { color: var(--dim2); }
  .sessions-header [data-sort].active { color: var(--accent); }
  .session-row {
    display: grid;
    grid-template-columns: 170px 1fr 110px 110px 155px 110px 110px;
    align-items: center; padding: 12px 20px;
    border-bottom: 1px solid var(--border); transition: background .1s;
    cursor: pointer;
  }
  .session-row.selected { background: rgba(0,212,255,0.07); }
  .session-row:last-child { border-bottom: none; }
  .session-row:hover { background: rgba(0,212,255,0.03); }

  .lid { font-family: var(--mono); font-size: 11px; color: var(--accent); letter-spacing: 1px; }
  .session-nickname {
    font-size: 13px; color: var(--text);
    padding: 3px 0;
  }
  .session-nickname.empty { color: var(--dim); font-style: italic; }
  .date { font-family: var(--mono); font-size: 11px; color: var(--dim); }

  .tag-chip {
    display: inline-flex; align-items: center;
    font-family: var(--mono); font-size: 10px; letter-spacing: 1px;
    border: 1px solid; border-radius: 3px; padding: 2px 8px;
    cursor: pointer;
  }
  .tag-mini {
    font-family: var(--mono); font-size: 9px; border: 1px solid;
    border-radius: 2px; padding: 1px 5px; cursor: pointer;
    white-space: nowrap; display: inline-block; transition: opacity .1s;
  }
  .tag-mini:hover { opacity: .75; }
  .tag-dd-wrap { position: relative; }
  .tag-dd {
    position: fixed; background: var(--surface); border: 1px solid var(--border2);
    border-radius: 6px; padding: 10px 12px; z-index: 500; min-width: 180px;
    display: flex; flex-direction: column; gap: 6px;
    box-shadow: 0 8px 24px rgba(0,0,0,.55);
  }
  .tag-dd-title { font-family: var(--mono); font-size: 9px; letter-spacing: 1px;
    text-transform: uppercase; color: var(--dim); }
  .tag-dd-chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .tag-dd-chip {
    display: inline-flex; align-items: center; gap: 4px;
    font-family: var(--mono); font-size: 10px; border: 1px solid;
    border-radius: 3px; padding: 3px 8px; cursor: pointer; transition: opacity .1s;
  }
  .tag-dd-chip:hover { opacity: .8; }
  /* Bottom row : stats + calendrier */
  .bottom-row { display: flex; gap: 16px; margin-top: 16px; align-items: flex-start; }
  /* Stats KPI */
  .stats-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; flex: 1; min-width: 0; overflow: hidden;
  }
  .stats-hdr {
    padding: 8px 14px; background: var(--surface2); border-bottom: 1px solid var(--border);
    font-family: var(--mono); font-size: 10px; letter-spacing: 2px;
    text-transform: uppercase; color: var(--dim);
  }
  .kpi-grid { display: grid; grid-template-columns: repeat(3,1fr); }
  .kpi { padding: 11px 14px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .kpi:nth-child(3n) { border-right: none; }
  .kpi:nth-last-child(-n+3) { border-bottom: none; }
  .kpi-lbl { font-family: var(--mono); font-size: 10px; letter-spacing: 1px;
    text-transform: uppercase; color: #8aaabb; margin-bottom: 4px; }
  .kpi-val { font-family: var(--mono); font-size: 18px; color: var(--text); line-height: 1.2; }
  .kpi-sub { font-family: var(--mono); font-size: 11px; color: var(--dim); margin-top: 1px; }
  /* Calendrier */
  .cal-panel { display: flex; gap: 0; align-items: stretch; flex-shrink: 0; }
  .cal-sidebar {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px 0 0 8px; width: 100px; flex-shrink: 0; overflow: hidden;
    border-right: none;
  }
  .cal-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 0 8px 8px 0; flex-shrink: 0; overflow: hidden;
  }
  .cal-nav {
    display: flex; align-items: center; padding: 7px 12px; gap: 8px;
    background: var(--surface2); border-bottom: 1px solid var(--border);
  }
  .cal-nav-title {
    font-family: var(--mono); font-size: 11px; letter-spacing: 2px;
    text-transform: uppercase; flex: 1; text-align: center;
    cursor: pointer; color: var(--dim); transition: color .12s;
  }
  .cal-nav-title:hover { color: var(--accent); }
  .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; padding: 8px 12px; }
  .cal-day { text-align: center; padding: 3px 2px; font-family: var(--mono); font-size: 10px;
             border-radius: 3px; cursor: default; min-height: 26px; }
  .cal-day.has-log { cursor: pointer; }
  .cal-day.has-log:hover { background: var(--surface2); }
  .cal-day.selected { background: var(--accent)33 !important; color: var(--accent); }
  .cal-day.today { font-weight: bold; color: var(--text); }
  .cal-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); margin: 2px auto 0; }
  .cal-pick { display: grid; grid-template-columns: repeat(3,1fr); gap: 4px; padding: 12px; }
  .cal-pick-m {
    text-align: center; padding: 7px 4px; border-radius: 3px;
    font-family: var(--mono); font-size: 10px; letter-spacing: 1px;
    cursor: pointer; border: 1px solid transparent; transition: all .1s;
  }
  .cal-pick-m:hover { background: var(--surface2); border-color: var(--border2); }
  .cal-pick-m.cal-cur { border-color: var(--accent); color: var(--accent); }

  .log-badge { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11px; }
  .log-badge .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .dot.ok { background: var(--accent3); }
  .dot.none { background: var(--dim); }
  .log-info { color: var(--dim); }
  .log-info span { color: var(--text); }

  .row-actions { display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
  .import-label {
    display: inline-block; background: transparent;
    border: 1px solid var(--border2); color: var(--dim);
    font-family: var(--mono); font-size: 10px; letter-spacing: 1px;
    padding: 5px 10px; border-radius: 4px; cursor: pointer;
    text-transform: uppercase; transition: all .12s; white-space: nowrap;
  }
  .import-label:hover { border-color: var(--accent); color: var(--accent); }
  .import-label input { display: none; }

  .empty {
    padding: 48px; text-align: center;
    font-family: var(--mono); font-size: 12px; color: var(--dim); letter-spacing: 2px;
  }

  .overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.7); z-index: 100;
    align-items: center; justify-content: center;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border2);
    border-radius: 8px; padding: 28px 32px; width: 420px; max-width: 90vw;
  }
  .modal h2 {
    font-size: 12px; font-weight: 700; letter-spacing: 2px;
    color: var(--accent); text-transform: uppercase; margin-bottom: 20px;
  }
  .modal label {
    display: block; font-family: var(--mono); font-size: 10px;
    letter-spacing: 2px; color: var(--dim); text-transform: uppercase; margin-bottom: 6px;
  }
  .modal input[type="text"] {
    width: 100%; background: var(--surface2); border: 1px solid var(--border2);
    color: var(--text); font-size: 14px; padding: 10px 12px;
    border-radius: 4px; outline: none; margin-bottom: 20px;
  }
  .modal input[type="text"]:focus { border-color: var(--accent); }
  .modal-hint { font-size: 11px; color: var(--dim); margin-top: -14px; margin-bottom: 20px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .btn.cancel { border-color: var(--dim); color: var(--dim); }
  .btn.cancel:hover { background: rgba(255,255,255,0.05); }

  .banner {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    padding: 8px 20px; border-radius: 4px; z-index: 999;
    font-family: var(--mono); font-size: 11px;
    white-space: nowrap; display: none; pointer-events: none;
  }
  .banner.err { display: block; background: rgba(255,77,77,0.12); border: 1px solid rgba(255,77,77,0.4); color: #ff6b35; }
  .banner.ok  { display: block; background: rgba(57,255,20,0.08); border: 1px solid rgba(57,255,20,0.35); color: var(--accent3); }

  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    display: inline-block; width: 12px; height: 12px;
    border: 2px solid var(--border2); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .6s linear infinite; vertical-align: middle;
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">
    <div class="logo-icon">✈</div>
    <div>
      <h1>DEDAL</h1>
      <span>STUDIO · HOME</span>
    </div>
  </div>
  <button class="btn" onclick="toggleConventionsPanel()" style="font-size:10px;padding:5px 12px;letter-spacing:1.5px;" title="Conventions de référence du modèle">⊹ MODÈLE</button>
  <button class="btn" onclick="window.location.href='/live.html'" style="font-size:10px;padding:5px 12px;letter-spacing:1.5px;margin-left:auto;background:rgba(0,212,255,0.08);border-color:rgba(0,212,255,0.3);color:#00d4ff;" title="Télémétrie live depuis le drone">TÉLÉMÉTRIE</button>
</div>

<div class="app-layout">

  <div id="banner" class="banner"></div>
  <!-- ── liste ── -->
  <div class="list-panel">
    <div class="toolbar">
      <button class="btn" onclick="openImportModal()">+ Importer un log</button>
      <button class="btn cancel" onclick="openNewModal()">+ Session vide</button>
      <input type="search" id="search" placeholder="Filtrer…" oninput="renderSessions()">
    </div>
    <div id="active-filters" style="display:none;flex-wrap:wrap;gap:4px;padding:0 0 12px 0"></div>
    <div class="sessions-wrap">
      <div class="sessions-header">
        <div>LID</div>
        <div data-sort="name" onclick="setSort('name')">Nom</div>
        <div data-sort="flight" onclick="setSort('flight')">Vol</div>
        <div data-sort="import" onclick="setSort('import')">Import</div>
        <div data-sort="duration" onclick="setSort('duration')">Log</div>
        <div class="tag-dd-wrap" id="tags-col-hdr" style="position:relative"></div>
        <div></div>
      </div>
      <div id="session-list"><div class="empty"><span class="spinner"></span></div></div>
    </div>
    <div class="bottom-row">
      <div class="stats-card" id="stats-card"></div>
      <div class="cal-panel">
        <div class="cal-sidebar" id="cal-sidebar"></div>
        <div class="cal-card" id="cal-card"></div>
      </div>
    </div>
  </div>

  <!-- ── poignée redimensionnement ── -->
  <div class="resize-handle" id="resize-handle"></div>

  <!-- ── carte ── -->
  <div class="map-panel" id="map-panel">
    <div class="map-controls">
      <span class="map-label">Carte</span>
      <button class="map-toggle" id="btn-marker" onclick="setMapMode('marker')">Marqueurs</button>
      <button class="map-toggle active" id="btn-trace"  onclick="setMapMode('trace')">Traces</button>
      <button class="map-toggle" id="btn-fitall" onclick="fitAllSessions()">⊞</button>
      <button class="map-toggle" id="btn-deselect"
        style="margin-left:auto;display:none"
        onclick="deselectSession()">✕ Tout afficher</button>
    </div>
    <div id="map"></div>
  </div>

</div>

<!-- import log modal -->
<div class="overlay" id="modal-import" onclick="closeModal(event)">
  <div class="modal">
    <h2>Importer un log CSV</h2>
    <label for="import-file">Fichier CSV (+ .meta optionnel — sélection multiple)</label>
    <input type="text" id="import-file-display" placeholder="Aucun fichier sélectionné" readonly
           onclick="document.getElementById('import-file-input').click()" style="cursor:pointer">
    <input type="file" id="import-file-input" accept=".csv,.meta" multiple style="display:none"
           onchange="document.getElementById('import-file-display').value=Array.from(this.files).map(f=>f.name).join(', ')">
    <label for="import-nickname">Nom (optionnel)</label>
    <input type="text" id="import-nickname" placeholder="Ex : Mission Alpha" autocomplete="off"
           onkeydown="if(event.key==='Enter') confirmImport()">
    <div class="modal-actions">
      <button class="btn cancel" onclick="document.getElementById('modal-import').classList.remove('open')">Annuler</button>
      <button class="btn" onclick="confirmImport()">Importer</button>
    </div>
  </div>
</div>

<!-- new empty session modal -->
<div class="overlay" id="modal-new" onclick="closeModal(event)">
  <div class="modal">
    <h2>Nouvelle session vide</h2>
    <label for="new-nickname">Nom (optionnel)</label>
    <input type="text" id="new-nickname" placeholder="Ex : Mission Alpha" autocomplete="off"
           onkeydown="if(event.key==='Enter') confirmNew()">
    <div class="modal-actions">
      <button class="btn cancel" onclick="document.getElementById('modal-new').classList.remove('open')">Annuler</button>
      <button class="btn" onclick="confirmNew()">Créer</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
'use strict';
let sessions = [];
let selectedLid = null;
let mapMode = 'trace'; // 'marker' | 'trace'
let _tagColors = {};   // {tagname: hexcolor} — loaded from /api/tag-colors
let _filterTags = new Set();
let _filterDate = null; // 'YYYY-MM-DD' or null
let _calYear = new Date().getFullYear();
let _calMonth = new Date().getMonth();
let _tagDropdownOpen = false;

// ── API ────────────────────────────────────────────────────────────────────

async function api(method, path, body) {
  const opts = { method, headers: {} };
  if (body !== undefined) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const r = await fetch(path, opts);
  if (r.status === 204) return null;
  return r.json();
}

// ── map ────────────────────────────────────────────────────────────────────

let map = null;
const mapMarkers = {};   // lid → L.Marker
const mapTracks = {};    // lid → L.Polyline (all sessions, dim)
let mapTrack = null;     // selected session track (highlighted)

function initMap() {
  map = L.map('map', { zoomControl: true, attributionControl: false });
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    maxZoom: 19,
  }).addTo(map);
  map.setView([46.5, 2.5], 5); // France par défaut
}

function _markerIcon(selected) {
  return L.divIcon({
    className: '',
    html: `<div style="
      width:12px;height:12px;border-radius:50%;
      background:${selected ? '#ffcc00' : '#00d4ff'};
      border:2px solid ${selected ? '#fff' : '#1a2d45'};
      box-shadow:0 0 6px ${selected ? '#ffcc00' : '#00d4ff'};
    "></div>`,
    iconSize: [12, 12],
    iconAnchor: [6, 6],
  });
}

function rebuildMarkers() {
  // Remove old markers
  Object.values(mapMarkers).forEach(m => map.removeLayer(m));
  Object.keys(mapMarkers).forEach(k => delete mapMarkers[k]);

  const hasSessions = sessions.filter(s => s.gps_home);
  if (!hasSessions.length) return;

  hasSessions.forEach(s => {
    const { lat, lon } = s.gps_home;
    const marker = L.marker([lat, lon], { icon: _markerIcon(s.lid === selectedLid) });
    const label = s.nickname || s.lid;
    marker.bindTooltip(label, { permanent: false, direction: 'top', offset: [0, -8] });
    marker.on('click', () => selectSession(s.lid));
    marker.addTo(map);
    mapMarkers[s.lid] = marker;
  });

  if (!selectedLid) {
    const bounds = L.latLngBounds(hasSessions.map(s => [s.gps_home.lat, s.gps_home.lon]));
    map.fitBounds(bounds, { padding: [32, 32], maxZoom: 14 });
  }
}

async function selectSession(lid) {
  // Toggle deselect
  if (selectedLid === lid) { deselectSession(); return; }

  selectedLid = lid;

  // Highlight row
  document.querySelectorAll('.session-row').forEach(r => r.classList.remove('selected'));
  const row = document.getElementById('row-' + lid);
  if (row) { row.classList.add('selected'); row.scrollIntoView({ block: 'nearest' }); }

  // Update marker icons
  Object.entries(mapMarkers).forEach(([k, m]) => m.setIcon(_markerIcon(k === lid)));

  // Show deselect button
  document.getElementById('btn-deselect').style.display = '';

  // Remove old highlighted track
  if (mapTrack) { map.removeLayer(mapTrack); mapTrack = null; }

  const s = sessions.find(x => x.lid === lid);

  if (mapMode === 'trace') {
    // Dim all background tracks
    Object.entries(mapTracks).forEach(([k, pl]) => {
      pl.setStyle(k === lid
        ? { color: '#ffcc00', weight: 2.5, opacity: 0.9 }
        : { color: '#00d4ff', weight: 1.5, opacity: 0.25 });
    });

    // If we already have the track in mapTracks, use it for bounds
    if (mapTracks[lid]) {
      map.fitBounds(mapTracks[lid].getBounds(), { padding: [32, 32] });
      return;
    }

    // Fetch and draw if not yet loaded
    try {
      const data = await fetch(`/api/sessions/${lid}/track`).then(r => r.json());
      if (data.points && data.points.length > 1) {
        // Replace dim placeholder with highlighted polyline
        mapTrack = L.polyline(data.points, {
          color: '#ffcc00', weight: 2.5, opacity: 0.9,
        }).addTo(map);
        map.fitBounds(mapTrack.getBounds(), { padding: [32, 32] });
        return;
      }
    } catch (_) {}
  }

  // Marker mode (or trace with no data) — fly to gps_home
  if (s && s.gps_home) {
    map.flyTo([s.gps_home.lat, s.gps_home.lon], 14, { duration: 0.8 });
  }
}

function deselectSession() {
  selectedLid = null;
  document.querySelectorAll('.session-row').forEach(r => r.classList.remove('selected'));
  document.getElementById('btn-deselect').style.display = 'none';
  Object.entries(mapMarkers).forEach(([, m]) => m.setIcon(_markerIcon(false)));
  if (mapTrack) { map.removeLayer(mapTrack); mapTrack = null; }
  // Reset all background tracks to dim
  Object.values(mapTracks).forEach(pl => pl.setStyle({ color: '#00d4ff', weight: 1.5, opacity: 0.25 }));
  const hasSessions = sessions.filter(s => s.gps_home);
  if (hasSessions.length) {
    const bounds = L.latLngBounds(hasSessions.map(s => [s.gps_home.lat, s.gps_home.lon]));
    map.fitBounds(bounds, { padding: [32, 32], maxZoom: 14 });
  }
}

function setMapMode(mode) {
  mapMode = mode;
  document.getElementById('btn-marker').classList.toggle('active', mode === 'marker');
  document.getElementById('btn-trace').classList.toggle('active', mode === 'trace');
  // Show/hide background tracks
  Object.values(mapTracks).forEach(pl => {
    if (mode === 'trace') pl.addTo(map); else map.removeLayer(pl);
  });
  if (mapTrack) { if (mode === 'trace') mapTrack.addTo(map); else map.removeLayer(mapTrack); }
  // Re-select current session with new mode
  if (selectedLid) { const lid = selectedLid; selectedLid = null; selectSession(lid); }
}

async function loadAllTracks() {
  // Remove stale tracks
  Object.entries(mapTracks).forEach(([lid, pl]) => {
    map.removeLayer(pl);
    delete mapTracks[lid];
  });
  if (mapMode !== 'trace') return;

  await Promise.all(sessions.map(async s => {
    if (!s.log_file) return; // no log → no track
    try {
      const data = await fetch(`/api/sessions/${s.lid}/track`).then(r => r.json());
      if (data.points && data.points.length > 1) {
        const isSelected = s.lid === selectedLid;
        const pl = L.polyline(data.points, {
          color: isSelected ? '#ffcc00' : '#00d4ff',
          weight: isSelected ? 2.5 : 1.5,
          opacity: isSelected ? 0.9 : 0.25,
        }).addTo(map);
        mapTracks[s.lid] = pl;
      }
    } catch (_) {}
  }));
}

// ── render ─────────────────────────────────────────────────────────────────

async function loadSessions() {
  try {
    [sessions, _tagColors] = await Promise.all([
      api('GET', '/api/sessions'),
      api('GET', '/api/tag-colors'),
    ]);
    _applySortHeader();
    renderTagColHeader();
    renderCalSidebar();
    renderCalendar();
    renderStats();
    renderSessions();
    rebuildMarkers();
    loadAllTracks();
  } catch (e) {
    showBanner('err', 'Impossible de charger les sessions : ' + e.message);
  }
}

let _sortKey = 'flight';
let _sortDir = 1; // 1 = desc (newest first), -1 = asc

function _applySortHeader() {
  document.querySelectorAll('.sessions-header [data-sort]').forEach(el => {
    const isActive = el.dataset.sort === _sortKey;
    el.classList.toggle('active', isActive);
    const labels = {name:'Nom', flight:'Vol', import:'Import', duration:'Log'};
    el.textContent = (labels[el.dataset.sort] || el.dataset.sort)
      + (isActive ? (_sortDir === 1 ? ' ↓' : ' ↑') : '');
  });
}

function setSort(key) {
  if (_sortKey === key) { _sortDir *= -1; }
  else { _sortKey = key; _sortDir = 1; }
  _applySortHeader();
  renderSessions();
}

function _sortValue(s) {
  if (_sortKey === 'name')     return (s.nickname || '').toLowerCase();
  if (_sortKey === 'flight')   return s.flight_date_utc || s.created_at || '';
  if (_sortKey === 'import')   return s.imported_at || s.created_at || '';
  if (_sortKey === 'duration') return s.log_meta?.duration_s || 0;
  return '';
}

function tagColor(name) {
  return _tagColors[name] || '#7b8fa1';
}

function toggleTagFilter(tag) {
  if (_filterTags.has(tag)) _filterTags.delete(tag); else _filterTags.add(tag);
  renderTagColHeader();
  renderActiveFilters();
  renderSessions();
}

function _fmtFilterDate(d) {
  if (!d) return '';
  if (d.length === 4) return d;
  if (d.length === 7) {
    const MN = ['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sep','Oct','Nov','Déc'];
    const [y, m] = d.split('-');
    return MN[parseInt(m,10)-1] + ' ' + y;
  }
  const [y, m, day] = d.split('-');
  return day + '/' + m + '/' + y;
}

function renderActiveFilters() {
  const el = document.getElementById('active-filters');
  if (!el) return;
  const hasFilters = _filterTags.size > 0 || _filterDate;
  el.style.display = hasFilters ? 'flex' : 'none';
  if (!hasFilters) { el.innerHTML = ''; return; }
  const chips = [..._filterTags].map(t =>
    `<span class="tag-chip" style="background:${tagColor(t)}22;border-color:${tagColor(t)};color:${tagColor(t)}"
      onclick="toggleTagFilter('${esc(t)}')">${esc(t)} ×</span>`
  ).join('');
  const dateChip = _filterDate
    ? `<span class="tag-chip" style="background:var(--accent)22;border-color:var(--accent);color:var(--accent)"
        onclick="setDateFilter(null)">${_fmtFilterDate(_filterDate)} ×</span>`
    : '';
  el.innerHTML = chips + dateChip
    + `<span style="font-family:var(--mono);font-size:10px;color:var(--dim);cursor:pointer;padding:2px 8px"
        onclick="_filterTags.clear();setDateFilter(null)">effacer tout</span>`;
}

function setDateFilter(dateStr) {
  _filterDate = dateStr;
  renderActiveFilters();
  renderCalSidebar();
  renderCalendar();
  renderSessions();
}

function renderTagColHeader() {
  const hdr = document.getElementById('tags-col-hdr');
  if (!hdr) return;
  // Remove any previous body-level dropdown
  const old = document.getElementById('_tagdd');
  if (old) old.remove();

  const n = _filterTags.size;
  const label = 'TAGS' + (n ? ` (${n})` : '') + ' ▾';
  hdr.innerHTML = `<span id="_tagTrigger" onclick="toggleTagDropdown(event)"
    style="cursor:pointer;font-family:var(--mono);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:${n ? 'var(--accent)' : 'var(--dim)'}">${label}</span>`;

  if (!_tagDropdownOpen) return;

  const allTags = Object.keys(_tagColors);
  const trigger = document.getElementById('_tagTrigger');
  const rect = (trigger || hdr).getBoundingClientRect();
  const dd = document.createElement('div');
  dd.id = '_tagdd';
  dd.className = 'tag-dd';
  dd.style.top  = (rect.bottom + 4) + 'px';
  dd.style.left = rect.left + 'px';

  if (!allTags.length) {
    dd.innerHTML = `<div class="tag-dd-title" style="font-style:italic">Aucune étiquette créée</div>`;
  } else {
    const chips = allTags.map(t => {
      const col = _tagColors[t] || '#7b8fa1';
      const active = _filterTags.has(t);
      return `<span class="tag-dd-chip" style="color:${col};border-color:${col};background:${active?col+'33':'transparent'}"
        onclick="event.stopPropagation();toggleTagFilter('${esc(t)}')">${esc(t)}${active?' ✓':''}</span>`;
    }).join('');
    dd.innerHTML = `<div class="tag-dd-title">Filtrer par étiquette</div>
      <div class="tag-dd-chips">${chips}</div>`
      + (n ? `<span style="font-family:var(--mono);font-size:9px;color:var(--dim);cursor:pointer;padding-top:2px"
          onclick="event.stopPropagation();_filterTags.clear();renderTagColHeader();renderActiveFilters();renderSessions()">Tout effacer</span>` : '');
  }
  document.body.appendChild(dd);
}

function toggleTagDropdown(event) {
  event.stopPropagation();
  _tagDropdownOpen = !_tagDropdownOpen;
  renderTagColHeader();
  if (_tagDropdownOpen) {
    document.addEventListener('click', function _close(e) {
      const dd = document.getElementById('_tagdd');
      if (dd && dd.contains(e.target)) return;
      _tagDropdownOpen = false;
      renderTagColHeader();
      document.removeEventListener('click', _close);
    });
  }
}

function renderSessions() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const list = document.getElementById('session-list');
  let filtered = (q
    ? sessions.filter(s => s.lid.toLowerCase().includes(q) ||
                           s.nickname.toLowerCase().includes(q) ||
                           (s.tags || []).some(t => t.toLowerCase().includes(q)))
    : [...sessions]
  ).sort((a, b) => {
    const va = _sortValue(a), vb = _sortValue(b);
    return va < vb ? _sortDir : va > vb ? -_sortDir : 0;
  });
  if (_filterTags.size > 0)
    filtered = filtered.filter(s => [..._filterTags].every(t => (s.tags || []).includes(t)));
  if (_filterDate)
    filtered = filtered.filter(s => ((s.flight_date_utc || s.created_at) || '').startsWith(_filterDate));

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty">Aucune session — importez un log CSV pour commencer.</div>';
    return;
  }

  list.innerHTML = filtered.map(s => {
    const tagsMini = (s.tags||[]).map(t =>
      `<span class="tag-mini" style="color:${tagColor(t)};border-color:${tagColor(t)}66"
        onclick="event.stopPropagation();toggleTagFilter('${esc(t)}')" title="${esc(t)}">${esc(t)}</span>`
    ).join(' ');
    return `
    <div class="session-row${s.lid === selectedLid ? ' selected' : ''}" id="row-${s.lid}"
         onclick="handleRowClick(event, '${s.lid}')"
         ondblclick="openSession(event, '${s.lid}')"
         oncontextmenu="showRenamePrompt(event, '${s.lid}')"
         onmouseenter="hoverSession('${s.lid}')"
         onmouseleave="unhoverSession('${s.lid}')">
      <div class="lid">${s.lid}</div>
      <div><span class="session-nickname${s.nickname ? '' : ' empty'}">${esc(s.nickname) || 'Sans nom'}</span></div>
      <div class="date">${fmtFlightDate(s)}</div>
      <div class="date">${fmtImportDate(s)}</div>
      <div class="log-badge">${logBadge(s)}</div>
      <div style="display:flex;flex-wrap:wrap;gap:3px;align-items:center">${tagsMini}</div>
      <div class="row-actions" onclick="event.stopPropagation()">
        ${s.log_file ? (s.meta_ref
          ? `<button class="btn sm" style="color:var(--accent3);border-color:var(--accent3)" title="Métadonnées GPS chargées — cliquer pour recharger" onclick="reloadMeta('${s.lid}')">✓ META</button>`
          : `<button class="btn sm" style="opacity:.55" title="Aucune référence .meta — cliquer pour recharger" onclick="reloadMeta('${s.lid}')">⟳ META</button>`) : ''}
        <button class="btn sm danger" onclick="deleteSession('${s.lid}')">✕</button>
      </div>
    </div>`;
  }).join('');
}

function handleRowClick(event, lid) {
  if (event.target.closest('button, a, label')) return;
  selectSession(lid);
}

function openSession(event, lid) {
  if (event.target.closest('button, a, label')) return;
  const s = sessions.find(x => x.lid === lid);
  if (!s || !s.log_file) return;
  sessionStorage.setItem('ds_lid', lid);
  window.location.href = '/viewer.html?lid=' + lid;
}

let _hoverTimer = null;
let _hoveredLid = null;

function hoverSession(lid) {
  _hoveredLid = lid;
  clearTimeout(_hoverTimer); // annule le re-fit éventuel d'un unhover précédent
  _hoverTimer = setTimeout(() => {
    if (_hoveredLid !== lid) return;
    if (mapMode === 'trace' && mapTracks[lid]) {
      if (lid !== selectedLid) {
        mapTracks[lid].setStyle({ color: '#00d4ff', opacity: 0.65, weight: 2 });
      }
      map.fitBounds(mapTracks[lid].getBounds(), { padding: [40, 40], animate: true });
    } else if (mapMarkers[lid]) {
      const s = sessions.find(x => x.lid === lid);
      if (s && s.gps_home) map.flyTo([s.gps_home.lat, s.gps_home.lon], 14, { duration: 0.5 });
    }
  }, 250);
}

function unhoverSession(lid) {
  _hoveredLid = null;
  clearTimeout(_hoverTimer);
  _hoverTimer = null;
  if (mapMode === 'trace' && mapTracks[lid] && lid !== selectedLid) {
    mapTracks[lid].setStyle({ color: '#00d4ff', opacity: 0.25, weight: 1.5 });
  }
  // Re-fit vers tous les vols seulement si rien n'est sélectionné ni survolé
  if (!selectedLid) {
    _hoverTimer = setTimeout(() => {
      if (selectedLid || _hoveredLid) return;
      if (mapMode === 'trace') {
        const bounds = Object.values(mapTracks)
          .map(pl => pl.getBounds()).filter(b => b.isValid());
        if (bounds.length)
          map.fitBounds(bounds.reduce((a, b) => a.extend(b)), { padding: [32, 32], maxZoom: 14 });
      } else {
        const pts = sessions.filter(s => s.gps_home).map(s => [s.gps_home.lat, s.gps_home.lon]);
        if (pts.length) map.fitBounds(L.latLngBounds(pts), { padding: [32, 32], maxZoom: 14 });
      }
    }, 700);
  }
}

function fitAllSessions() {
  if (selectedLid) deselectSession();
  const pts = sessions.filter(s => s.gps_home).map(s => [s.gps_home.lat, s.gps_home.lon]);
  if (pts.length) map.fitBounds(L.latLngBounds(pts), { padding: [32, 32], maxZoom: 14 });
}

function logBadge(s) {
  if (!s.log_file) return '<div class="dot none"></div><span class="log-info">—</span>';
  const m = s.log_meta || {};
  const dur = m.duration_s > 0 ? ` <span>${m.duration_s}s</span>` : '';
  const pts = m.row_count  > 0 ? `<span style="color:var(--dim)"> · ${m.row_count} pts</span>` : '';
  return `<div class="dot ok"></div><span class="log-info"><span>${esc(s.log_file)}</span>${dur}${pts}</span>`;
}

// ── import ─────────────────────────────────────────────────────────────────

function openImportModal() {
  document.getElementById('import-file-display').value = '';
  document.getElementById('import-file-input').value = '';
  document.getElementById('import-nickname').value = '';
  document.getElementById('modal-import').classList.add('open');
  setTimeout(() => document.getElementById('import-nickname').focus(), 50);
}

async function confirmImport() {
  const fileInput = document.getElementById('import-file-input');
  const files = Array.from(fileInput.files);
  const csvFile = files.find(f => f.name.toLowerCase().endsWith('.csv'));
  const metaFile = files.find(f => f.name.toLowerCase().endsWith('.meta'));
  if (!csvFile) { showBanner('err', 'Sélectionnez un fichier CSV.'); return; }
  const nickname = document.getElementById('import-nickname').value.trim();
  document.getElementById('modal-import').classList.remove('open');

  const fd = new FormData();
  fd.append('file', csvFile);
  if (metaFile) fd.append('meta_file', metaFile);
  try {
    const r = await fetch(`/api/sessions/import?nickname=${encodeURIComponent(nickname)}`,
                          { method: 'POST', body: fd });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const s = await r.json();
    sessions.unshift(s);
    renderSessions();
    renderStats();
    renderCalendar();
    rebuildMarkers();
    loadAllTracks();
    showBanner('ok', `Session ${s.lid} créée — ${s.log_meta?.row_count || '?'} points, ${s.log_meta?.duration_s || '?'}s`);
  } catch (e) {
    showBanner('err', 'Erreur import : ' + e.message);
  }
}

// ── new empty session ──────────────────────────────────────────────────────

function openNewModal() {
  document.getElementById('new-nickname').value = '';
  document.getElementById('modal-new').classList.add('open');
  setTimeout(() => document.getElementById('new-nickname').focus(), 50);
}

async function confirmNew() {
  document.getElementById('modal-new').classList.remove('open');
  const nickname = document.getElementById('new-nickname').value.trim();
  try {
    const s = await api('POST', '/api/sessions', { nickname });
    sessions.unshift(s);
    renderSessions();
    renderStats();
  } catch (e) {
    showBanner('err', 'Erreur création : ' + e.message);
  }
}

// ── rename ─────────────────────────────────────────────────────────────────

async function showRenamePrompt(event, lid) {
  event.preventDefault();
  event.stopPropagation();
  const s = sessions.find(x => x.lid === lid);
  if (!s) return;
  const newName = prompt('Renommer la session :', s.nickname || '');
  if (newName === null) return;
  const trimmed = newName.trim();
  if (trimmed === s.nickname) return;
  try {
    const updated = await api('PATCH', `/api/sessions/${lid}`, { nickname: trimmed });
    Object.assign(s, updated);
    renderSessions();
  } catch (e) {
    showBanner('err', 'Erreur renommage : ' + e.message);
  }
}

// ── delete ─────────────────────────────────────────────────────────────────

async function deleteSession(lid) {
  if (!confirm(`Supprimer la session ${lid} et tous ses fichiers ?`)) return;
  try {
    await api('DELETE', `/api/sessions/${lid}`);
    sessions = sessions.filter(s => s.lid !== lid);
    if (selectedLid === lid) { selectedLid = null; }
    renderSessions();
    renderStats();
    rebuildMarkers();
    loadAllTracks();
  } catch (e) {
    showBanner('err', 'Erreur suppression : ' + e.message);
  }
}

// ── attach video ───────────────────────────────────────────────────────────

async function attachVideo(lid, input) {
  const file = input.files[0];
  if (!file) return;
  const fd = new FormData();
  fd.append('file', file);
  try {
    const r = await fetch(`/api/sessions/${lid}/video`, { method: 'POST', body: fd });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const updated = await r.json();
    const idx = sessions.findIndex(s => s.lid === lid);
    if (idx !== -1) sessions[idx] = updated;
    renderSessions();
    showBanner('ok', `Vidéo attachée à ${lid}`);
  } catch (e) {
    showBanner('err', 'Erreur vidéo : ' + e.message);
  } finally {
    input.value = '';
  }
}

// ── utils ──────────────────────────────────────────────────────────────────

function closeModal(e) {
  if (e.target.classList.contains('overlay')) e.target.classList.remove('open');
}

function esc(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderStats() {
  const el = document.getElementById('stats-card');
  if (!el) return;

  const withLog   = sessions.filter(s => s.log_file);
  // Use armed_s (actual flight time) when available, fallback to duration_s (total log time)
  const durs      = withLog.map(s => s.log_meta?.armed_s || s.log_meta?.duration_s || 0).filter(d => d > 0);
  const totalDur  = durs.reduce((a, d) => a + d, 0);
  const avgDur    = durs.length ? totalDur / durs.length : 0;
  const minDur    = durs.length ? Math.min(...durs) : 0;
  const maxDur    = durs.length ? Math.max(...durs) : 0;
  const totalPts  = withLog.reduce((a, s) => a + (s.log_meta?.row_count || 0), 0);
  const withMeta  = sessions.filter(s => s.meta_ref).length;
  const withVideo = sessions.filter(s => s.video_file).length;
  const allTags   = new Set(sessions.flatMap(s => s.tags || []));

  const fmtDur = s => {
    s = Math.round(s);
    if (s < 60) return s + 's';
    if (s < 3600) return Math.floor(s/60) + 'min ' + String(s%60).padStart(2,'0') + 's';
    const h = Math.floor(s/3600), m = Math.floor((s%3600)/60);
    return h + 'h' + String(m).padStart(2,'0');
  };
  const fmtPts = n => n >= 1e6 ? (n/1e6).toFixed(1)+' M' : n >= 1e3 ? Math.round(n/1e3)+' k' : String(n);
  const pct = (n, t) => t ? Math.round(n/t*100)+'%' : '—';

  const kpi = (lbl, val, sub) =>
    `<div class="kpi"><div class="kpi-lbl">${lbl}</div><div class="kpi-val">${val}</div>`
    + (sub ? `<div class="kpi-sub">${sub}</div>` : '') + `</div>`;

  el.innerHTML = `<div class="stats-hdr">Récapitulatif</div><div class="kpi-grid">`
    + kpi('Vols',          sessions.length,                            withLog.length + ' avec log')
    + kpi('Durée totale',  totalDur > 0 ? fmtDur(totalDur) : '—',    durs.length + ' vols')
    + kpi('Moy. / vol',    avgDur   > 0 ? fmtDur(avgDur)   : '—',    durs.length ? fmtDur(minDur) + ' – ' + fmtDur(maxDur) : '')
    + kpi('Vol + long',    maxDur   > 0 ? fmtDur(maxDur)   : '—',    '')
    + kpi('Vol + court',   minDur   > 0 ? fmtDur(minDur)   : '—',    '')
    + kpi('Points log',    totalPts > 0 ? fmtPts(totalPts) : '—',    withLog.length ? '~' + fmtPts(Math.round(totalPts/withLog.length)) + '/vol' : '')
    + kpi('GPS sync',      withMeta + ' / ' + withLog.length,         pct(withMeta, withLog.length))
    + kpi('Avec vidéo',    withVideo,                                  pct(withVideo, sessions.length))
    + kpi('Étiquettes',    allTags.size,                               allTags.size ? [...allTags].slice(0,3).join(', ') + (allTags.size > 3 ? '…' : '') : 'aucune')
    + '</div>';
}

function selectCalMonth(m) {
  _calMonth = m;
  const ym = _calYear + '-' + String(m+1).padStart(2,'0');
  setDateFilter(_filterDate === ym ? null : ym);
}

function selectCalYear() {
  const y = String(_calYear);
  setDateFilter(_filterDate === y ? null : y);
}

function renderCalSidebar() {
  const el = document.getElementById('cal-sidebar');
  if (!el) return;
  const MN = ['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sep','Oct','Nov','Déc'];

  const mCounts = {}, yCounts = {};
  sessions.forEach(s => {
    const d = ((s.flight_date_utc || s.created_at) || '').slice(0,10);
    if (!d) return;
    const ym = d.slice(0,7), y = d.slice(0,4);
    mCounts[ym] = (mCounts[ym]||0) + 1;
    yCounts[y]  = (yCounts[y] ||0) + 1;
  });

  const yearStr = String(_calYear);
  const isYearSel = _filterDate === yearStr;

  let html = `<div style="display:flex;align-items:center;padding:5px 6px;background:var(--surface2);border-bottom:1px solid var(--border);gap:3px">
    <button class="btn sm" style="padding:2px 6px;flex-shrink:0" onclick="_calYear--;renderCalSidebar();renderCalendar()">‹</button>
    <span onclick="selectCalYear()" title="${isYearSel?'Désélectionner':'Filtrer '+_calYear}"
      style="font-family:var(--mono);font-size:11px;flex:1;text-align:center;cursor:pointer;
        color:${isYearSel?'var(--accent)':'var(--text)'};font-weight:${isYearSel?'700':'400'}"
    >${_calYear}${yCounts[yearStr]?'<span style="color:var(--accent);font-size:7px;vertical-align:super"> ●</span>':''}</span>
    <button class="btn sm" style="padding:2px 6px;flex-shrink:0" onclick="_calYear++;renderCalSidebar();renderCalendar()">›</button>
  </div><div>`;

  for (let m = 0; m < 12; m++) {
    const ym   = `${yearStr}-${String(m+1).padStart(2,'0')}`;
    const cnt  = mCounts[ym] || 0;
    const isSel = _filterDate === ym
      || (_filterDate && _filterDate.length === 10 && _filterDate.startsWith(ym));
    const isCur = m === _calMonth;
    html += `<div onclick="selectCalMonth(${m})"
      style="display:flex;align-items:center;justify-content:space-between;
        padding:4px 8px 4px 6px;cursor:pointer;
        background:${isSel?'rgba(0,212,255,0.1)':'transparent'};
        border-left:2px solid ${isCur?'var(--accent)':'transparent'}"
      onmouseover="this.style.background='${isSel?'rgba(0,212,255,0.14)':'var(--surface2)'}'"
      onmouseout="this.style.background='${isSel?'rgba(0,212,255,0.1)':'transparent'}'">
      <span style="font-family:var(--mono);font-size:10px;letter-spacing:1px;
        color:${isSel?'var(--accent)':cnt?'var(--text)':'var(--dim)'}">${MN[m]}</span>
      <span style="font-size:7px;color:${cnt?'var(--accent)':'var(--border2)'}">●</span>
    </div>`;
  }
  html += '</div>';
  el.innerHTML = html;
}

function renderCalendar() {
  const el = document.getElementById('cal-card');
  if (!el) return;
  const MONTHS_FULL = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  const DAYS = ['L','M','M','J','V','S','D'];
  const today = new Date();
  const pad = n => String(n).padStart(2,'0');

  // Dates with sessions
  const datesWithLog = {};
  sessions.forEach(s => {
    const d = ((s.flight_date_utc || s.created_at) || '').slice(0, 10);
    if (d) datesWithLog[d] = (datesWithLog[d] || 0) + 1;
  });

  // Header month nav
  let html = `<div class="cal-nav">
    <button class="btn sm" onclick="_calMonth--;if(_calMonth<0){_calMonth=11;_calYear--;}renderCalSidebar();renderCalendar()">‹</button>
    <span class="cal-nav-title" style="cursor:default">${MONTHS_FULL[_calMonth]}</span>
    <button class="btn sm" onclick="_calMonth++;if(_calMonth>11){_calMonth=0;_calYear++;}renderCalSidebar();renderCalendar()">›</button>
  </div>`;

  // Day grid
  const firstDay = new Date(_calYear, _calMonth, 1);
  const lastDay  = new Date(_calYear, _calMonth + 1, 0);
  const startDow = (firstDay.getDay() + 6) % 7;

  html += `<div class="cal-grid">`;
  html += DAYS.map(d => `<div style="text-align:center;font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--dim);padding:2px">${d}</div>`).join('');
  for (let i = 0; i < startDow; i++) html += `<div class="cal-day"></div>`;
  for (let day = 1; day <= lastDay.getDate(); day++) {
    const dateStr = `${_calYear}-${pad(_calMonth+1)}-${pad(day)}`;
    const count   = datesWithLog[dateStr] || 0;
    const isToday = today.getFullYear()===_calYear && today.getMonth()===_calMonth && today.getDate()===day;
    const isSelected = _filterDate === dateStr;
    const cls = ['cal-day', count?'has-log':'', isToday?'today':'', isSelected?'selected':''].filter(Boolean).join(' ');
    const click = count ? `onclick="setDateFilter(${isSelected?'null':`'${dateStr}'`})"` : '';
    html += `<div class="${cls}" ${click}>${day}${count ? `<div class="cal-dot"></div>` : ''}</div>`;
  }
  html += '</div>';

  el.innerHTML = html;
}

function fmtFlightDate(s) {
  // Use flight_date_utc + tz_offset_s if available, else created_at
  if (s.flight_date_utc && s.tz_offset_s != null) {
    const utcMs = new Date(s.flight_date_utc + 'Z').getTime();
    const localMs = utcMs + s.tz_offset_s * 1000;
    const d = new Date(localMs);
    const pad = n => String(n).padStart(2, '0');
    const dateStr = `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`;
    const timeStr = `${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`;
    const tzLabel = s.tz_name ? ` <span style="color:var(--dim);font-size:9px;">[${s.tz_name.split('/').pop()}]</span>` : '';
    return dateStr + ' ' + timeStr + tzLabel;
  }
  if (s.flight_date_utc) {
    return s.flight_date_utc.replace('T', ' ').slice(0, 16) + ' <span style="color:var(--dim);font-size:9px;">UTC</span>';
  }
  return fmtDate(s.created_at) + ' <span style="color:var(--dim);font-size:9px;">≈mtime</span>';
}

function fmtImportDate(s) {
  return fmtDate(s.imported_at || s.created_at);
}

async function reloadMeta(lid) {
  try {
    const r = await fetch(`/api/sessions/${lid}/reload-meta`, { method: 'POST' });
    const data = await r.json();
    if (!r.ok) { showBanner('err', 'Erreur reload-meta : ' + (data.error || r.status)); return; }
    if (data.warning) {
      showBanner('err', `${lid} : aucun log.meta trouvé dans le dossier session.`);
    } else {
      showBanner('ok', `${lid} : métadonnées rechargées — ${data.flight_date_utc || 'pas de date GPS'}`);
    }
    // Refresh session in local array
    const idx = sessions.findIndex(s => s.lid === lid);
    if (idx >= 0) sessions[idx] = data;
    renderSessions();
  } catch(e) {
    showBanner('err', 'Erreur réseau : ' + e.message);
  }
}

function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit', year:'2-digit' })
       + ' ' + d.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });
}

let _bannerTimer;
function showBanner(type, msg) {
  const el = document.getElementById('banner');
  el.className = 'banner ' + type;
  el.textContent = msg;
  clearTimeout(_bannerTimer);
  _bannerTimer = setTimeout(() => { el.className = 'banner'; }, 5000);
}

// ── resize handle ─────────────────────────────────────────────────────────

(function () {
  const handle = document.getElementById('resize-handle');
  const panel  = document.getElementById('map-panel');
  const MIN = 200, MAX = 900;
  let dragging = false, startX = 0, startW = 0;

  handle.addEventListener('mousedown', e => {
    dragging = true;
    startX = e.clientX;
    startW = panel.offsetWidth;
    handle.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
  });

  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const w = Math.min(MAX, Math.max(MIN, startW - (e.clientX - startX)));
    panel.style.width = w + 'px';
    if (map) map.invalidateSize();
  });

  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    handle.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  });
})();

initMap();
loadSessions();
</script>
